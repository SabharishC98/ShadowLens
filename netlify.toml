[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-BACKEND-URL/api/:splat"
  status = 200

[[redirects]]
  from = "/ws/*"
  to = "https://YOUR-RENDER-BACKEND-URL/ws/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
